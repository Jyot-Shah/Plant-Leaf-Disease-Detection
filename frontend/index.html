<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Leaf Disease Detection</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>
        <i class="fa-solid fa-leaf" style="color: #138a36"></i> Plant Leaf
        Disease Detection & Treatment System
      </h1>
      <p><i>Upload a leaf image to detect diseases and get medication advice</i></p>
    </div>

    <div class="container">
      <div class="main-section">
        <div class="upload-card">
          <h2>Upload Leaf Image</h2>
          <form id="uploadForm">
            <div class="drop-zone" id="dropZone">
              <i class="fa-solid fa-cloud-arrow-up drop-zone-icon"></i>
              <span class="drop-zone__prompt" id="dropZonePrompt"
                >Drag & drop or click to upload</span
              >
              <input type="file" id="fileInput" accept="image/*" required />
            </div>
            <button type="submit">Analyze Image</button>
          </form>
        </div>

        <div id="result" class="result-card"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
